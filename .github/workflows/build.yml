name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  # Mutation testing: PIT changes the production code in small ways and the tests must notice.
  # Fails if fewer than ${mutation.threshold} percent (see pom.xml) of the mutants are killed.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Mutation tests
        run: ./mvnw -B -Pmutation verify
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: '*/target/pit-reports'
          if-no-files-found: ignore
