name: snapshot

# Publishes the -SNAPSHOT version of every module to the Central snapshot repository, after the build workflow has passed on
# main (kickoff 12, decision 92). Nothing is signed: Central does not validate snapshots.
#
# Safety:
#  * It starts only from a finished run of the build workflow for a push to main of this repository, never for a pull request,
#    and never with pull_request_target. The code of a fork cannot reach the secrets.
#  * It runs in the GitHub environment "release", which the owner protects with a required reviewer.
#  * The job can read the repository and nothing else.
#  * The secrets are CENTRAL_TOKEN_USERNAME and CENTRAL_TOKEN_PASSWORD of that environment, and no step prints them. When they
#    are missing, the job stops with one line that says which.
#  * Only the newest commit of main is published, so that an old run waiting for approval cannot replace a newer snapshot.
#  * No build cache: a job that holds the secrets takes nothing from a cache that other jobs write.
#
# Once, by the owner: enable snapshots for the namespace in the Central Portal (see the pull request of kickoff 12).

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Is this a snapshot of the newest commit?
        id: what
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version="$(python3 -I -c "import xml.etree.ElementTree as E; print(E.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")"
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$RUN_SHA" ]; then
            echo "::notice::main has moved on since this build; the run for the newer commit publishes its snapshot."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [[ "$version" != *-SNAPSHOT ]]; then
            echo "::notice::The version $version is not a snapshot; nothing to publish here (a release is published by a tag)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that the secrets exist
        if: steps.what.outputs.publish == 'true'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          missing=""
          [ -n "$CENTRAL_TOKEN_USERNAME" ] || missing="$missing CENTRAL_TOKEN_USERNAME"
          [ -n "$CENTRAL_TOKEN_PASSWORD" ] || missing="$missing CENTRAL_TOKEN_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secret(s) missing in the environment 'release':$missing. Nothing was published."
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.what.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '21'
          # Writes a settings.xml with the server "central" that reads the two environment variables below; no value is stored.
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD

      # The build workflow has run the tests of this commit. An ordinary build first makes the test jars that some modules
      # share, which the release profile leaves out of what is published.
      - name: Install the modules
        if: steps.what.outputs.publish == 'true'
        run: ./mvnw -B install -DskipTests -Dinvoker.skip=true

      - name: Publish the snapshot
        if: steps.what.outputs.publish == 'true'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: ./mvnw -B -Prelease -Dgpg.skip=true -DskipTests -Dinvoker.skip=true deploy
