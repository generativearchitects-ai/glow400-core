name: authors

# Keeps AUTHORS in sync with the git history. Contributors do nothing: once a pull request (from a fork
# or not) is merged into main, this workflow regenerates AUTHORS and, if it changed, opens a pull request.
#
# Requires, once, in the repository settings: Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests".
# Pull requests opened with the default token do not start other workflows; close and reopen the
# pull request, or merge it, as repository rules allow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate AUTHORS
        run: scripts/update-authors.sh
      - name: Open a pull request if AUTHORS changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- AUTHORS; then
            echo "AUTHORS is up to date."
            exit 0
          fi
          branch=chore/update-authors
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add AUTHORS
          git commit -m "chore: update AUTHORS"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore: update AUTHORS" \
              --body "Regenerated by \`scripts/update-authors.sh\` after a change on main."
          fi
