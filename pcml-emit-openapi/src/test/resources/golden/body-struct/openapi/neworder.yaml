openapi: "3.1.0"
info:
  title: neworder
  version: "1.0.0"
servers:
  - url: "/{tenant}/{environment}"
    variables:
      tenant:
        description: "The tenant the program is called for."
        default: tenant
      environment:
        description: "The environment the program is called for."
        default: environment
paths:
  "/orders":
    post:
      operationId: neworder
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              type: object
              properties:
                header:
                  type: object
                  properties:
                    customerId:
                      type: string
                      maxLength: 8
                      x-glow400-field:
                        name: P0HDR.CUSTID
                        wire: "char(8)"
                    note:
                      type: string
                      maxLength: 40
                      x-glow400-field:
                        name: P0HDR.NOTE
                        wire: "char(40)"
                  required:
                    - customerId
                  additionalProperties: false
                  x-glow400-field:
                    name: P0HDR
                    wire: "struct(HEADER)"
                tags:
                  type: array
                  items:
                    type: string
                    maxLength: 6
                  maxItems: 4
                  x-glow400-field:
                    name: P0TAGS
                    wire: "char(6)"
              additionalProperties: false
      responses:
        "200":
          description: "The program ran"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  orderNumber:
                    type: string
                    maxLength: 10
                    x-glow400-field:
                      name: P0ORDN
                      wire: "char(10)"
                additionalProperties: false
        "400":
          description: "The request is not valid"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: "Not found"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "502":
          description: "The program or the system could not be reached or answered badly"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "503":
          description: "Service unavailable"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "504":
          description: "The program did not answer in time"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
components:
  schemas:
    ProblemDetails:
      type: object
      description: "A problem details object (RFC 9457)."
      properties:
        type:
          type: string
          format: uri-reference
          description: "A URI that identifies the kind of problem."
        title:
          type: string
          description: "A short summary of the kind of problem."
        status:
          type: integer
          description: "The HTTP status code."
        detail:
          type: string
          description: "An explanation of this occurrence of the problem."
        instance:
          type: string
          format: uri-reference
          description: "A URI that identifies this occurrence of the problem."
