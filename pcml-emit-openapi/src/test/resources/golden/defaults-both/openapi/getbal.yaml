openapi: "3.1.0"
info:
  title: getbal
  version: "1.0.0"
servers:
  - url: "/{tenant}/{environment}"
    variables:
      tenant:
        description: "The tenant the program is called for."
        default: tenant
      environment:
        description: "The environment the program is called for."
        default: environment
paths:
  "/balances":
    get:
      operationId: getbal
      parameters:
        - name: acct
          in: query
          required: false
          schema:
            type: string
            maxLength: 10
          x-glow400-field:
            name: ACCT
            wire: "char(10)"
        - name: bal
          in: query
          required: false
          description: "A decimal number with up to 11 digits, 2 of them after the decimal point."
          schema:
            type: number
          x-glow400-field:
            name: BAL
            wire: "packed(11,2)"
            digits: 11
            scale: 2
      responses:
        "200":
          description: "The program ran"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  acct:
                    type: string
                    maxLength: 10
                    x-glow400-field:
                      name: ACCT
                      wire: "char(10)"
                  bal:
                    description: "A decimal number with up to 11 digits, 2 of them after the decimal point."
                    type: number
                    x-glow400-field:
                      name: BAL
                      wire: "packed(11,2)"
                      digits: 11
                      scale: 2
                additionalProperties: false
        "400":
          description: "The request is not valid"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: "Not found"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "502":
          description: "The program or the system could not be reached or answered badly"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "503":
          description: "Service unavailable"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "504":
          description: "The program did not answer in time"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
components:
  schemas:
    ProblemDetails:
      type: object
      description: "A problem details object (RFC 9457)."
      properties:
        type:
          type: string
          format: uri-reference
          description: "A URI that identifies the kind of problem."
        title:
          type: string
          description: "A short summary of the kind of problem."
        status:
          type: integer
          description: "The HTTP status code."
        detail:
          type: string
          description: "An explanation of this occurrence of the problem."
        instance:
          type: string
          format: uri-reference
          description: "A URI that identifies this occurrence of the problem."
