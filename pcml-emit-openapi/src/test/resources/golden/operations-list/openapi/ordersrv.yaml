openapi: "3.1.0"
info:
  title: ordersrv
  version: "1.2.0"
servers:
  - url: "/{tenant}/{environment}"
    variables:
      tenant:
        description: "The tenant the program is called for."
        default: tenant
      environment:
        description: "The environment the program is called for."
        default: environment
tags:
  - name: changes
  - name: orders
paths:
  "/orders/{orderNumber}/status":
    get:
      operationId: get-order-status
      summary: "Returns the status of a purchase order"
      tags:
        - orders
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 9999999999
          x-glow400-field:
            name: P0ORDN
            wire: "char(10)"
      responses:
        "200":
          description: "The program ran"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  status:
                    type: string
                    maxLength: 1
                    x-glow400-field:
                      name: P0STAT
                      wire: "char(1)"
                additionalProperties: false
        "400":
          description: "The request is not valid"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: "Not found"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "502":
          description: "The program or the system could not be reached or answered badly"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "503":
          description: "Service unavailable"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "504":
          description: "The program did not answer in time"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
  "/orders/{orderNumber}/cancel":
    post:
      operationId: cancel-order
      tags:
        - orders
        - changes
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 9999999999
          x-glow400-field:
            name: P0ORDN
            wire: "char(10)"
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 20
                  x-glow400-field:
                    name: P0RSN
                    wire: "char(20)"
              additionalProperties: false
      responses:
        "204":
          description: "No content"
        "400":
          description: "The request is not valid"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "404":
          description: "Not found"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "502":
          description: "The program or the system could not be reached or answered badly"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "503":
          description: "Service unavailable"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
        "504":
          description: "The program did not answer in time"
          content:
            "application/problem+json":
              schema:
                "$ref": "#/components/schemas/ProblemDetails"
components:
  schemas:
    ProblemDetails:
      type: object
      description: "A problem details object (RFC 9457)."
      properties:
        type:
          type: string
          format: uri-reference
          description: "A URI that identifies the kind of problem."
        title:
          type: string
          description: "A short summary of the kind of problem."
        status:
          type: integer
          description: "The HTTP status code."
        detail:
          type: string
          description: "An explanation of this occurrence of the problem."
        instance:
          type: string
          format: uri-reference
          description: "A URI that identifies this occurrence of the problem."
